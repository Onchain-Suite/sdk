name: Release

# One button, pick the bump. Builds + tests, bumps the version, publishes the
# package to npm AND the browser loader (dist/inapp.js) to our own R2 CDN, then
# pushes the version commit/tag and cuts a GitHub Release.
#
#   beta  → prerelease (X.Y.Z-beta.N), published under the `beta` dist-tag so it
#           NEVER becomes `latest`. Install with `npm i @onchainsuite/sdk@beta`.
#   patch → X.Y.(Z+1)   ┐
#   minor → X.(Y+1).0   ├ published as `latest` (the default install).
#   major → (X+1).0.0   ┘
#
# Two delivery channels, on purpose:
#   npm       — for bundled apps (`npm i @onchainsuite/sdk`, React/Next/ESM).
#   R2 CDN    — for the no-build <script> loader the dashboard hands out;
#               served from cdn.onchainsuite.com, a host WE control (see below).
#
# One-time setup:
#   - secret `NPM_TOKEN`            npm "Automation" token, publish rights to @onchainsuite
#   - secret `R2_ACCESS_KEY_ID`     ┐ Cloudflare R2 API token (S3 creds) scoped
#   - secret `R2_SECRET_ACCESS_KEY` ┤ to the CDN bucket
#   - secret `R2_ACCOUNT_ID`        ┘ Cloudflare account id (builds the S3 endpoint)
#   - variable `R2_BUCKET`          the bucket cdn.onchainsuite.com fronts
#   GITHUB_TOKEN is provided automatically. If the R2 config is absent the CDN
#   step skips with a warning instead of failing the release.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump / channel"
        required: true
        default: beta
        type: choice
        options: [beta, patch, minor, major]

permissions:
  contents: write # push the version commit + tag, create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      # Full gate BEFORE we bump/publish, so a bad build never reaches npm.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Fail if NPM_TOKEN is missing
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ -n "$NPM_TOKEN" ] || { echo "::error::Set the NPM_TOKEN repo secret first"; exit 1; }
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump version
        id: v
        run: |
          if [ "${{ inputs.release_type }}" = "beta" ]; then
            npm version prerelease --preid=beta -m "release: v%s"
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
          else
            npm version "${{ inputs.release_type }}" -m "release: v%s"
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        run: npm publish --access public --tag "${{ steps.v.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Serve the browser loader (dist/inapp.js) from OUR OWN CDN, not a public npm
      # CDN. cdn.onchainsuite.com fronts this R2 bucket, so the dashboard install
      # snippet loads a file WE control: our uptime, our CSP origin, our cache rules,
      # hotfixable without waiting on npm/unpkg propagation. This is the production
      # path; unpkg was only the interim while the bucket didn't exist.
      #
      # Two objects per release:
      #   inapp-<version>.js  immutable, cached forever — customers pin this
      #   inapp.js            stable alias, short TTL — moved ONLY on a stable
      #                       release (never beta), same rule as the `latest` dist-tag
      #
      # One-time setup: repo secrets R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY /
      # R2_ACCOUNT_ID (an R2 API token scoped to the bucket) + repo variable
      # R2_BUCKET. Until they exist this step SKIPS with a warning — npm already
      # published and that's immutable, so failing here would be misleading.
      - name: Publish inapp.js to R2 (cdn.onchainsuite.com)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          VERSION: ${{ steps.v.outputs.version }}
          DIST_TAG: ${{ steps.v.outputs.dist_tag }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] \
             || [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "::warning::R2 not configured (need R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID secrets + R2_BUCKET variable) — skipping CDN upload. npm publish already succeeded."
            exit 0
          fi
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          CT="text/javascript; charset=utf-8"

          # Immutable versioned object — safe to cache forever because the URL
          # changes on every release.
          aws s3 cp dist/inapp.js "s3://${R2_BUCKET}/inapp-${VERSION}.js" \
            --endpoint-url "$ENDPOINT" \
            --content-type "$CT" \
            --cache-control "public, max-age=31536000, immutable"

          # Stable alias — only a stable release moves it; beta stays pinned-only so
          # `inapp.js` never serves a prerelease to production sites.
          if [ "$DIST_TAG" = "latest" ]; then
            aws s3 cp dist/inapp.js "s3://${R2_BUCKET}/inapp.js" \
              --endpoint-url "$ENDPOINT" \
              --content-type "$CT" \
              --cache-control "public, max-age=300"
          fi

          # SRI hash for the versioned file, so the snippet can add integrity=.
          SRI="sha384-$(openssl dgst -sha384 -binary dist/inapp.js | openssl base64 -A)"
          {
            echo "### CDN upload (R2 → cdn.onchainsuite.com)"
            echo ""
            echo "- Versioned: \`https://cdn.onchainsuite.com/inapp-${VERSION}.js\` (immutable)"
            [ "$DIST_TAG" = "latest" ] \
              && echo "- Stable alias \`inapp.js\` → moved to ${VERSION}" \
              || echo "- Stable alias \`inapp.js\` → unchanged (beta stays pinned-only)"
            echo "- SRI: \`${SRI}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Push version commit + tag
        run: git push --follow-tags
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRE=""
          [ "${{ steps.v.outputs.dist_tag }}" = "beta" ] && PRE="--prerelease"
          gh release create "v${{ steps.v.outputs.version }}" \
            --title "v${{ steps.v.outputs.version }}" \
            --generate-notes $PRE
